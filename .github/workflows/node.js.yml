# Build verification for the Scent Layer monorepo.
# Runs on every push and PR to main. Installs all workspace deps, builds
# the Vite client, generates the Prisma client, and prepares a FastComet
# .tar.gz deployment package.

name: Node.js CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Build client (Vite)
        run: npm --workspace client run build
      - name: Generate Prisma client
        run: npm --workspace server run build
      - name: Create FastComet deployment archive
        run: tar -czf scent-layer-dist.tar.gz -C client/dist .
      - name: Upload FastComet deployment package
        uses: actions/upload-artifact@v4
        with:
          name: scent-layer-fastcomet-${{ matrix.node-version }}
          path: scent-layer-dist.tar.gz
          compression-level: 0
